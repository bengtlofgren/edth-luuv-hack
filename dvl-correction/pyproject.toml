[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dvl-correction"
version = "0.1.0"
description = "DVL and IMU navigation fusion layer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
edth-luuv-fuse = "dvl_correction.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
